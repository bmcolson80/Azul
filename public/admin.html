<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Azul — Admin</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&display=swap');
:root{--navy:#1a1f3a;--navy-light:#252c50;--navy-mid:#2e3760;--gold:#c9a227;--gold-light:#e8c547;--cream:#f5ecd7;--cream-dark:#e8d8b8;--shadow:rgba(0,0,0,0.4);--radius:12px;--radius-sm:6px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:var(--cream);font-family:'Lato',sans-serif;min-height:100vh;padding:24px}
.wrap{max-width:1100px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.title{font-family:'Cinzel',serif;font-size:clamp(20px,4vw,28px);font-weight:700;letter-spacing:3px;color:var(--gold)}
.title-sub{font-size:11px;letter-spacing:2px;color:rgba(245,236,215,.5);margin-top:2px}
.actions{display:flex;gap:10px}
.btn{background:var(--navy-mid);color:var(--cream);border:1px solid rgba(201,162,39,.3);padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;font-family:'Lato',sans-serif}
.btn:hover{background:var(--navy-light)}
.btn-back{text-decoration:none;display:inline-flex;align-items:center}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:28px}
.card{background:var(--navy-light);border:1px solid rgba(201,162,39,.2);border-radius:var(--radius);padding:18px;box-shadow:0 4px 16px var(--shadow)}
.card-value{font-family:'Cinzel',serif;font-size:30px;font-weight:700;color:var(--gold-light)}
.card-label{font-size:11px;letter-spacing:1.5px;color:rgba(245,236,215,.55);text-transform:uppercase;margin-top:6px}

.panel{background:var(--navy-light);border:1px solid rgba(201,162,39,.2);border-radius:var(--radius);overflow:hidden;box-shadow:0 8px 32px var(--shadow)}
.panel-header{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08);font-family:'Cinzel',serif;font-size:14px;letter-spacing:2px;color:var(--gold)}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06)}
th{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:rgba(245,236,215,.5);font-weight:400;position:sticky;top:0;background:var(--navy-light)}
tr:hover td{background:rgba(255,255,255,.03)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.pill-on{background:rgba(46,123,181,.25);color:#7ec4ea}
.pill-off{background:rgba(255,255,255,.08);color:rgba(245,236,215,.4)}
.coplayers{max-width:220px;overflow:hidden;text-overflow:ellipsis;color:rgba(245,236,215,.7);font-size:12px}
.win{color:#6fbf6f;font-weight:700}
.loss{color:rgba(245,236,215,.4)}
.empty,.denied{padding:60px 20px;text-align:center;color:rgba(245,236,215,.5)}
.denied a{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="empty">Loading…</div>
</div>

<script>
async function main() {
  const app = document.getElementById('app');

  const meRes = await fetch('/api/me').catch(() => null);
  if (!meRes || !meRes.ok) {
    app.innerHTML = denied('You must be signed in to view this page.');
    return;
  }
  const me = await meRes.json();
  if (!me.isAdmin) {
    app.innerHTML = denied('This page is only available to the admin account.');
    return;
  }

  const [overviewRes, usersRes] = await Promise.all([
    fetch('/api/admin/overview'),
    fetch('/api/admin/users'),
  ]);
  if (!overviewRes.ok || !usersRes.ok) {
    app.innerHTML = denied('Failed to load admin data.');
    return;
  }
  const overview = await overviewRes.json();
  const { users } = await usersRes.json();

  render(overview, users);
}

function denied(msg) {
  return `<div class="denied"><p>${msg}</p><p style="margin-top:12px"><a href="/">← Back to Azul</a></p></div>`;
}

function render(o, users) {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="header">
      <div>
        <div class="title">AZUL — ADMIN</div>
        <div class="title-sub">ANALYTICS DASHBOARD</div>
      </div>
      <div class="actions">
        <button class="btn" onclick="location.reload()">↻ Refresh</button>
        <a class="btn btn-back" href="/">← Back to game</a>
      </div>
    </div>

    <div class="cards">
      ${card(o.totalUsers, 'Registered Users')}
      ${card(o.totalGamesStarted, 'Games Started')}
      ${card(o.activeGames, 'Games In Progress')}
      ${card(o.completedGames, 'Games Completed')}
      ${card(o.pushEnabledUsers, 'Push Enabled')}
    </div>

    <div class="panel">
      <div class="panel-header">USERS</div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Name</th><th>Email</th><th>Joined</th>
              <th class="num">Games</th><th class="num">Wins</th><th class="num">Losses</th>
              <th>Push</th><th>Email Notif</th><th>Played With</th>
            </tr>
          </thead>
          <tbody>${users.map(row).join('')}</tbody>
        </table>
      </div>
    </div>
  `;
}

function card(value, label) {
  return `<div class="card"><div class="card-value">${value}</div><div class="card-label">${label}</div></div>`;
}

function row(u) {
  const joined = u.created ? new Date(u.created * 1000).toLocaleDateString() : '–';
  const coplayers = u.coplayers.length ? u.coplayers.join(', ') : '–';
  return `<tr>
    <td>${escapeHtml(u.name)}</td>
    <td>${escapeHtml(u.email)}</td>
    <td>${joined}</td>
    <td class="num">${u.gamesPlayed}</td>
    <td class="num win">${u.wins}</td>
    <td class="num loss">${u.losses}</td>
    <td>${pill(u.pushEnabled)}</td>
    <td>${pill(u.notifyEmail)}</td>
    <td class="coplayers" title="${escapeHtml(coplayers)}">${escapeHtml(coplayers)}</td>
  </tr>`;
}

function pill(on) {
  return on ? '<span class="pill pill-on">On</span>' : '<span class="pill pill-off">Off</span>';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

main();
</script>
</body>
</html>
